<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: scoreboard across the top, graph-paper board on the left, one question card on the right; stacks on phones. */

  --bg:#EDF1F3; --surface:#FFFFFF; --ink:#1D2730; --muted:#5B6873;
  --grid:#D6DEE3; --axis:#8796A1;
  --dough:#E4A54A; --dough-hi:#F4D08A; --crust:#A8641E; --spot:#8A4A14;
  --tomato:#D4432A; --tomato-ink:#FFFFFF; --basil:#2C8548; --line:#C9D3DA;
  --team1:#2462C8; --team2:#8B3DB8; --team-ink:#FFFFFF;

  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141A20; --surface:#1E272F; --ink:#E7ECEF; --muted:#9BA8B2;
  --grid:#26313A; --axis:#5E6C78; --dough:#DFA046; --dough-hi:#EFC97F; --crust:#9C5C1A; --spot:#7A4012;
  --tomato:#F0664B; --tomato-ink:#1A0E0B; --basil:#5CC27C; --line:#33404B;
  --team1:#6F9CF2; --team2:#C68AEB; --team-ink:#10161C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141A20; --surface:#1E272F; --ink:#E7ECEF; --muted:#9BA8B2;
  --grid:#26313A; --axis:#5E6C78; --dough:#DFA046; --dough-hi:#EFC97F; --crust:#9C5C1A; --spot:#7A4012;
  --tomato:#F0664B; --tomato-ink:#1A0E0B; --basil:#5CC27C; --line:#33404B;

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.app{max-width:1100px;margin:0 auto;display:grid;gap:18px}

.team.t1 .nm{color:var(--team1)} .team.t2 .nm{color:var(--team2)}
.team.t1.active{border-color:var(--team1);transform:scale(1.06)}
.team.t2.active{border-color:var(--team2);transform:scale(1.06)}

@media (min-width:820px){.main{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.board-wrap{min-width:0}
svg#board{width:100%;max-width:560px;display:block;margin:0 auto;touch-action:none;cursor:grab;border-radius:6px}

.turn .who{font-family:var(--display);font-size:1.35rem;font-weight:800}
.turn .count{font-size:.9rem;opacity:.9}

.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.choice{font-family:var(--display);font-size:1.45rem;font-weight:600;min-height:72px;border-color:var(--line)}
.choice:not(:disabled):hover{border-color:var(--ink)}

.small{font-size:.9rem;color:var(--muted)}

.ref.mini{padding:6px 12px;gap:10px;width:fit-content}
.ref.mini p{font-weight:700}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.top-right{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pick{display:grid;gap:8px}
.levels{display:flex;gap:10px;flex-wrap:wrap}
button.skip{justify-self:start;min-height:40px;padding:6px 12px;font-size:.9rem;font-weight:700;border-color:var(--line);color:var(--muted)}
button.mute{min-height:48px;width:52px;padding:0;display:grid;place-items:center;border-color:var(--line)}
button.mute[aria-pressed="true"]{color:var(--muted)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.35)}100%{transform:scale(1)}}
.team.bump b{animation:bump .5s ease-out;display:inline-block}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
.yum{animation:pop .45s ease-out;transform-origin:200px 200px}
@media (prefers-reduced-motion:reduce){.yum{animation:none}.team{transition:none}}
</style>

<div class="app">
  <header>
    <div>
      <div class="level-tag" id="levelTag">Curry puff team game</div>
      <h1>How Many Curry Puffs?</h1>
    </div>
    <div class="top-right">
    <div class="scores" id="scores" hidden>
      <div class="team t1" id="team1"><span class="nm">Team 1</span><b id="score1">0</b></div>
      <div class="team t2" id="team2"><span class="nm">Team 2</span><b id="score2">0</b></div>
    </div>
    <button class="mute" id="mute"></button>
    </div>
  </header>
  <div class="main">
    <div class="board-wrap">
      <svg id="board" viewBox="0 0 400 400" tabindex="0" role="slider" aria-label="Terminal arm. Use left and right arrow keys to turn it." aria-valuemin="0" aria-valuemax="24" aria-valuenow="0">
        <defs>
          <radialGradient id="doughGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:var(--dough-hi)"/>
            <stop offset="100%" style="stop-color:var(--dough)"/>
          </radialGradient>
          <radialGradient id="doughGrad2" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:var(--dough)"/>
            <stop offset="100%" style="stop-color:var(--crust)"/>
          </radialGradient>
          <clipPath id="clip0"><path id="clipPath0"/></clipPath>
          <clipPath id="clip1"><path id="clipPath1"/></clipPath>
          <filter id="puffShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".3"/></filter>
        </defs>
        <g id="grid"></g>
        <g id="ghost"></g>
        <g id="plain" display="none"></g>
        <g id="pizza"></g>
        <g id="arms"></g>
      </svg>
      <svg id="pair" viewBox="0 0 400 200" hidden role="img" aria-label="Two curry puffs side by side, each on its own axes. The filled part is what has been eaten."><g id="pairG"></g></svg>
    </div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
</div>

<script>
(() => {
const C = 200, R = 140, ARM = R + 22, TAU = Math.PI * 2, STEP = Math.PI / 12;
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);
const svg = $("board");
const el = (tag, attrs = {}, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) { const v = String(attrs[k]); if (v.includes("var(")) e.style.setProperty(k, v); else e.setAttribute(k, v); } if (parent) parent.appendChild(e); return e; };
const pt = (a, r) => [C + r * Math.cos(a), C - r * Math.sin(a)];

/* Amounts are counted in twelfths of a curry puff (one curry puff = half a turn) */
const SPECIAL = [2,3,4,6,8,9,10,12,14,15,16,18,20,21,22,24];
const STOPS = [0, ...SPECIAL];                 // the only places the arm can rest
const isSpecial = k => k === 0 || SPECIAL.includes(((Math.abs(k) - 1) % 24) + 1);
const STOPS4 = Array.from({ length: 73 }, (_, i) => i - 24).filter(isSpecial);   // -2π … 4π
// level 4 questions: only amounts below 0 or above 2π
const POOL4 = [...SPECIAL.map(k => -k), ...SPECIAL.map(k => k + 24)];
// level 1 amounts: every fraction between 1 and 2 with denominator 2, 3, 4, 5, 6 or 8
const WARM = [2, 3, 4, 5, 6, 8].flatMap(d => Array.from({ length: d - 1 }, (_, i) => [d + i + 1, d])).filter(([n, d]) => gcd(n, d) === 1);
const used = { 1: new Set(), 2: new Set(), 3: new Set(), 4: new Set() }; // questions already played, so a redo gets new ones
function pickFresh(pool, n, seen, key = x => String(x)){
  const fresh = shuffle(pool.filter(x => !seen.has(key(x)))), old = shuffle(pool.filter(x => seen.has(key(x))));
  if (fresh.length < n) seen.clear();
  const out = [...fresh, ...old].slice(0, n); out.forEach(x => seen.add(key(x))); return out;
}
const TURNS = 10;                              // per level: 5 for each team
const LEVELS = 4;

let theta = 0, raw = 0, ghostK = null;
let state = { screen: "start", level: 1, qs: [], i: 0, checked: false, scores: [0, 0] };
const team = () => state.i % 2;                                         // 0 = Team 1, 1 = Team 2
const player = () => (state.level - 1) * (TURNS / 2) + Math.floor(state.i / 2) + 1;

/* ---------- labels ---------- */
function gcd(a, b){ return b ? gcd(b, a % b) : a; }
const frac = (n, d) => `<span class="fr"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const mixed = (w, n, d) => `<span class="mixed">${w}${frac(n, d)}</span>`;
function parts(k){ if (k === 0) return [0, 1]; const g = gcd(Math.abs(k), 12); return [k / g, 12 / g]; }
function puffLabel(k){
  const [n, d] = parts(k);
  if (k === 0) return "0 curry puffs";
  if (d === 1) return n === 1 ? "1 curry puff" : `${n} curry puffs`;
  return `${frac(n, d)} ${n / d > 1 ? "curry puffs" : "curry puff"}`;
}
function piLabel(k){
  if (k === 0) return "0";
  const [n0, d] = parts(Math.abs(k)), sign = k < 0 ? "−" : "";
  const top = n0 === 1 ? "π" : `${n0}π`;
  return sign + (d === 1 ? top : frac(top, d));
}
const label = (k, lvl) => lvl >= 3 ? piLabel(k) : puffLabel(k);
const wide = () => state.level === 4 && state.screen === "play";
const stops = () => wide() ? STOPS4 : STOPS;
const range = () => wide() ? [-TAU, 2 * TAU] : [0, TAU];
const nearestStop = a => stops().reduce((b, k) => Math.abs(k * STEP - a) < Math.abs(b * STEP - a) ? k : b, 0);
const snapK = () => Math.round(theta / STEP);

const GAP = 0;
// a braided seam along a puff's straight folded edge; puff 1's sits just above the x-axis, puff 2's just below
function braid(g, x1, x2, y, tilt, op = 1){
  const lo = Math.min(x1, x2), hi = Math.max(x1, x2);
  for (let x = lo + 5; x <= hi - 4; x += 9)
    el("ellipse", { cx: x, cy: y, rx: 7, ry: 4, transform: `rotate(${tilt} ${x} ${y})`, fill: "var(--dough-hi)", stroke: "var(--crust)", "stroke-width": 1.5, opacity: op }, g);
}
function piece(a1, a2, r, cy){ // one wedge of a puff, never more than half a turn
  const x1 = C + r * Math.cos(a1), y1 = cy - r * Math.sin(a1), x2 = C + r * Math.cos(a2), y2 = cy - r * Math.sin(a2);
  return `M${C} ${cy} L${x1} ${y1} A${r} ${r} 0 0 0 ${x2} ${y2}Z`;
}
/* ---------- static grid, ticks, outline of the two puffs ---------- */
(function drawGrid(){
  const g = $("grid");
  for (let v = 25; v <= 375; v += 35) {
    el("line", { x1: v, y1: 25, x2: v, y2: 375, stroke: "var(--grid)", "stroke-width": 1 }, g);
    el("line", { x1: 25, y1: v, x2: 375, y2: v, stroke: "var(--grid)", "stroke-width": 1 }, g);
  }
  el("line", { x1: 18, y1: C, x2: 382, y2: C, stroke: "var(--axis)", "stroke-width": 2 }, g);
  el("line", { x1: C, y1: 18, x2: C, y2: 382, stroke: "var(--axis)", "stroke-width": 2 }, g);
  el("path", { d: "M382 200 l-9 -5 v10z M200 18 l-5 9 h10z", fill: "var(--axis)" }, g);
  const t1 = el("text", { x: 384, y: 190, "text-anchor": "end", fill: "var(--muted)", "font-size": 15, "font-style": "italic", "font-family": "Georgia, serif" }, g); t1.textContent = "x";
  const t2 = el("text", { x: 210, y: 30, fill: "var(--muted)", "font-size": 15, "font-style": "italic", "font-family": "Georgia, serif" }, g); t2.textContent = "y";
  STOPS.forEach(k => { const a = k * STEP, big = k % 6 === 0, [x1, y1] = pt(a, R + 3), [x2, y2] = pt(a, R + (big ? 17 : 13));
    el("line", { x1, y1, x2, y2, stroke: "var(--ink)", "stroke-width": big ? 3 : 2, "stroke-linecap": "round" }, g); });
  // plain unit circle for levels 3 and 4
  el("circle", { cx: C, cy: C, r: R, fill: "none", stroke: "var(--ink)", "stroke-width": 2.5 }, $("plain"));
  const gh = $("ghost");
  [[0, C - GAP], [Math.PI, C + GAP]].forEach(([a0, cy]) => {
    el("path", { d: piece(a0, a0 + Math.PI, R, cy), fill: "var(--dough)", "fill-opacity": .14, stroke: "var(--crust)", "stroke-opacity": .6, "stroke-width": 2.5, "stroke-dasharray": "6 5" }, gh);
    braid(gh, C - R + 4, C + R - 4, cy + (a0 ? 6 : -6), a0 ? -40 : 40, .45);
  });
  [["curry puff 1", C - GAP - 52], ["curry puff 2", C + GAP + 64]].forEach(([s, y]) => {
    const t = el("text", { x: C - 66, y, "text-anchor": "middle", fill: "var(--crust)", "font-size": 15, "font-weight": 700, "font-family": "var(--body)" }, gh); t.textContent = s;
  });
})();

/* toasty spots, fixed so they don't jump around */
const SPOTS = (() => { let s = 7; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  return Array.from({ length: 34 }, () => { const a = r() * TAU, d = Math.sqrt(r()) * (R - 22); return [C + d * Math.cos(a), C - d * Math.sin(a), 2 + r() * 3.5]; }); })();

function sectorPath(a, r, cx = C, cy = C){
  if (a <= 0.0005) return "";
  if (a >= TAU - 0.0005) return `M${cx + r} ${cy} A${r} ${r} 0 1 0 ${cx - r} ${cy} A${r} ${r} 0 1 0 ${cx + r} ${cy}Z`;
  const x = cx + r * Math.cos(a), y = cy - r * Math.sin(a);
  return `M${cx} ${cy} L${cx + r} ${cy} A${r} ${r} 0 ${a > Math.PI ? 1 : 0} 0 ${x} ${y}Z`;
}
function rope(g, a, x, y, rx, ry){
  const deg = -a * 180 / Math.PI + 50;
  el("ellipse", { cx: x, cy: y, rx, ry, transform: `rotate(${deg} ${x} ${y})`, fill: "var(--dough-hi)", stroke: "var(--crust)", "stroke-width": 1.5 }, g);
}

/* ---------- board: the swept part is the curry puff that has been eaten ---------- */
function draw(){
  const p = $("pizza"); p.innerHTML = "";
  // levels 3 and 4 use a plain unit circle: no curry puffs
  const plain = state.level >= 3 && ["play", "end"].includes(state.screen) || state.screen === "interlude" && state.level >= 3;
  $("ghost").setAttribute("display", plain ? "none" : "inline"); $("plain").setAttribute("display", plain ? "inline" : "none");
  // eaten region split into half-turn pieces; each piece belongs to the top puff or the bottom puff.
  // a second lap (past 2π) is drawn as a smaller puff stacked on top of the first lap.
  const pieces = [];
  if (!plain && Math.abs(theta) > 0.001) {
    const lo = Math.min(0, theta), hi = Math.max(0, theta); let a = lo;
    while (a < hi - 0.001) { const nx = Math.min(hi, (Math.floor(a / Math.PI + 1e-9) + 1) * Math.PI); pieces.push([a, nx]); a = nx; }
  }
  const band = (g, x1, y1, x2, y2) => {
    el("line", { x1, y1, x2, y2, stroke: "var(--crust)", "stroke-width": 9, "stroke-linecap": "round" }, g);
    el("line", { x1, y1, x2, y2, stroke: "var(--dough-hi)", "stroke-width": 3, "stroke-linecap": "round" }, g);
  };
  const onFold = a => Math.abs(a / Math.PI - Math.round(a / Math.PI)) < 1e-6;
  pieces.forEach(([a1, a2], i) => {
    const mid = (a1 + a2) / 2, lap = Math.floor(Math.abs(mid) / TAU), rr = lap ? R - 36 : R;
    const top = ((mid % TAU) + TAU) % TAU < Math.PI, cy = C, y = cy + (top ? -6 : 6), tilt = top ? 40 : -40;
    const g = el("g", { filter: "url(#puffShadow)" }, p);
    const cp = el("clipPath", { id: "cp" + i }, g); el("path", { d: piece(a1, a2, rr - 12, cy) }, cp);
    el("path", { d: piece(a1, a2, rr - 10, cy), fill: lap ? "url(#doughGrad2)" : "url(#doughGrad)", stroke: "var(--crust)", "stroke-width": 2 }, g);
    const spots = el("g", { "clip-path": `url(#cp${i})` }, g);
    SPOTS.forEach(([x, y2, r]) => el("circle", { cx: x, cy: y2, r, fill: "var(--spot)", "fill-opacity": .35 }, spots));
    for (let a = a1; a <= a2 + 1e-6; a += Math.PI / 36) rope(g, a, C + (rr - 4) * Math.cos(a), cy - (rr - 4) * Math.sin(a), 10, 5);
    if (a2 - a1 >= Math.PI - 0.01) braid(g, C - rr + 4, C + rr - 4, y, tilt);
    else [a1, a2].forEach(a => {
      const ex = C + (rr - 10) * Math.cos(a), ey = cy - (rr - 10) * Math.sin(a);
      if (onFold(a)) braid(g, C, Math.cos(a) > 0 ? C + rr - 4 : C - rr + 4, y, tilt);   // folded edge on the x-axis
      else band(g, C, cy, ex, ey);                                                       // bitten edge
    });
  });
